# Build moorFV against the beamFoam commit pinned by the submodule. The weekly
# run, and a manual run with beamfoam_main set, build against the latest
# beamFoam main instead, to catch changes in beamFoam early
name: Building moorFV

on:
  workflow_dispatch:
    inputs:
      beamfoam_main:
        description: "Build against the latest beamFoam main, not the pinned commit"
        type: boolean
        default: false
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

# A new push to a pull request cancels its older build; other runs never wait
# for or cancel each other
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        container-image:
          - name: "OpenFOAM-v2312"
            image: "opencfd/openfoam-dev:2312"
            source: "/usr/lib/openfoam/openfoam2312/etc/bashrc"
            buildflags: "-j"

    container:
      image: ${{ matrix.container-image.image }}

    steps:
      - name: Install git on container
        run: |
          apt update
          apt install -y git

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          # Full history, so that src/Allwmake can check that the pinned
          # beamFoam commit is on beamFoam main
          fetch-depth: 0

      - name: Switch beamFoam submodule to the latest main
        if: github.event_name == 'schedule' || inputs.beamfoam_main
        shell: bash
        run: |
          git -C src/beamFoam fetch origin main
          git -C src/beamFoam switch main || git -C src/beamFoam switch --track origin/main
          git -C src/beamFoam pull --ff-only origin main

      - name: Build beamFoam and moorFV
        shell: bash -l {0}
        env:
          BEAMFOAM_DIR: ${{ github.workspace }}/src/beamFoam
        run: |
          echo "Using OpenFOAM version: ${{ matrix.container-image.name }}"
          source ${{ matrix.container-image.source }}

          # This shell does not stop on errors, so check each build
          (cd "${BEAMFOAM_DIR}" && ./Allwmake -j) || exit 1

          cd "${GITHUB_WORKSPACE}"
          ./Allwmake || exit 1
