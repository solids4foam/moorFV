# Check that the file headers match bin/moorFVUpdateHeaders
name: Checking file headers

on:
  workflow_dispatch:
  pull_request:
  push:

jobs:
  check-headers:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check file headers
        run: bin/moorFVUpdateHeaders -check $(git ls-files ':!src/beamFoam')
